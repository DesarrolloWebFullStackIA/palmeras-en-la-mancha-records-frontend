<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Palmeras en la Mancha — Vinyl Records & Archive Console</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">

  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap"
    rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <header class="fixed top-0 left-0 w-full z-50 bg-white border-b border-slate-200 shadow-sm">

    <div class="h-20 px-6 flex items-center justify-between">

      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">

      <div class="w-10 h-10 rounded-full overflow-hidden bg-slate-900 shrink-0">
        <img src="img/logo.png" alt="Logo" class="w-full h-full object-cover">
      </div>

      <div>
        <div class="text-lg font-bold text-slate-900 leading-tight">
          Palmeras en la Mancha
        </div>
        <div class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">
          Vinyl Records & Archive Console
        </div>
      </div>

      <nav class="hidden md:flex items-center gap-2">

        <a href="index.html" class="px-4 py-2 text-sm font-semibold text-blue-700 bg-slate-100 rounded-lg">
          Álbumes
        </a>

        <a href="html/filiales.html" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-900">
          Gestión de Filiales
        </a>

        <a href="html/discograficas.html" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-900">
          Discográficas & Productoras
        </a>

        <a href="html/ediciones-albumes.html" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-900">
          Ediciones de Álbumes
        </a>

      </nav>
    </div>

  </header>

  <main class="pt-20 min-h-screen">

    <section class="bg-white border-b border-slate-200 px-6 py-4">

      <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between">

        <div class="relative flex-1 max-w-xl">

          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
            search
          </span>

          <input id="catalogSearchInput" type="text" placeholder="Buscar por título, artista o discográfica..."
            class="w-full h-11 bg-slate-50 border border-slate-200 pl-11 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">

        </div>

        <button type="button" onclick="goToCreatePage()"
          class="h-11 px-5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg flex items-center justify-center gap-2">

          <span class="material-symbols-outlined">
            library_add
          </span>

          + Nuevo Álbum

        </button>

      </div>

    </section>

    <section class="px-6 py-10">

      <div class="max-w-7xl mx-auto">

        <div id="albumsCatalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- Las tarjetas de los álbumes se cargan dinámicamente desde la API -->
        </div>

      </div>

    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-6 px-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-700">Palmeras en la Mancha</span>
        <span>|</span>
        <span>Sistema de Inventario &amp; Gestión Musical</span>
      </div>
      <div class="flex items-center gap-2 text-[11px] text-emerald-600 font-semibold bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Cloudinary CDN Sync Active</span>
      </div>
      <div class="text-[11px]">
        &copy; 2026 Palmeras en la Mancha Records. Todos los derechos reservados.
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>

</body>

</html>
