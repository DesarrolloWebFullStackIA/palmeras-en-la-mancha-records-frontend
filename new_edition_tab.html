<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Nueva Tirada - Palmeras en la Mancha Records</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/styles2.css" />
</head>

<body class="bg-surface p-6">
  <!-- Pestaña para registrar nueva tirada/prensado -->
  <main class="tab-container max-w-3xl mx-auto bg-card rounded-xl shadow-lg p-6" id="new-edition-tab">
    <div class="tab-header flex justify-between items-center mb-6 pb-4 border-b border-border">
      <div class="tab-title-group flex items-center gap-3">
        <span class="material-symbols-outlined text-primary text-3xl">disc_full</span>
        <div>
          <h1 class="tab-title text-xl font-bold">Registrar Nueva Tirada / Prensado</h1>
          <p class="tab-subtitle text-xs text-muted uppercase tracking-wider">FORMULARIO DE CONTROL DE PRODUCCIÓN FÍSICA</p>
        </div>
      </div>
      <button class="btn-icon" id="close-tab-btn" type="button" aria-label="Cerrar pestaña">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <form class="tab-form space-y-4" id="new-edition-form">
      <div class="form-row cols-2 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-group flex flex-col gap-1">
          <label class="form-label font-medium text-sm">Álbum Asociado</label>
          <select class="form-select p-2 rounded border" name="albumId">
            <option value="PLM-042">Viento de Levante & Silencios (PLM-042)</option>
            <option value="PLM-089">Llanura Modular & Eco Solar (PLM-089)</option>
            <option value="PLM-114">Canto Rodado & Cencerradas (PLM-114)</option>
            <option value="PLM-205">Surcos de Esparto & Cuerda (PLM-205)</option>
            <option value="PLM-240">Lirio Azul & Vórtice Manchego (PLM-240)</option>
          </select>
        </div>
        <div class="form-group flex flex-col gap-1">
          <label class="form-label font-medium text-sm">Código de Matriz / Catálogo</label>
          <input class="form-input font-mono p-2 rounded border" name="matrixCode" placeholder="ej. PLM-240-DLX" type="text" required />
        </div>
      </div>

      <div class="form-row cols-3 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="form-group flex flex-col gap-1">
          <label class="form-label font-medium text-sm">Formato</label>
          <select class="form-select p-2 rounded border" name="format">
            <option>LP 12" Estándar</option>
            <option>LP 12" Deluxe Gatefold</option>
            <option>2xLP Double Album</option>
            <option>Single 7" (45 RPM)</option>
            <option>Boxset de Colección</option>
            <option>Cassette CrO2</option>
            <option>Test Pressing (TP)</option>
          </select>
        </div>
        <div class="form-group flex flex-col gap-1">
          <label class="form-label font-medium text-sm">Gramaje</label>
          <select class="form-select p-2 rounded border" name="weight">
            <option>180g Virgin Vinyl</option>
            <option>200g Audiophile</option>
            <option>140g Standard</option>
            <option>Cinta Cassette Type II</option>
          </select>
        </div>
        <div class="form-group flex flex-col gap-1">
          <label class="form-label font-medium text-sm">Tirada (Unidades)</label>
          <input class="form-input font-mono p-2 rounded border" name="editionSize" placeholder="500" type="number" required />
        </div>
      </div>

      <div class="form-group flex flex-col gap-1">
        <label class="form-label font-medium text-sm">Variante de Color & Prensado Especial</label>
        <input class="form-input p-2 rounded border" name="colorVariant"
          placeholder="ej. Mármol Azul Cobalto & Blanco Níveo con salpicaduras opacas" type="text" />
      </div>

      <div class="form-group flex flex-col gap-1">
        <label class="form-label font-medium text-sm">Inserts, Extras y Material Gráfico</label>
        <textarea class="form-textarea p-2 rounded border" name="extras"
          placeholder="ej. Libreto 16 páginas munken 150g, funda interior polietileno..." rows="3"></textarea>
      </div>

      <div class="tab-footer flex justify-end gap-3 pt-4 border-t border-border mt-6">
        <button class="btn btn-secondary px-4 py-2 rounded border" id="cancel-tab-btn" type="button">Cancelar</button>
        <button class="btn btn-primary px-4 py-2 rounded bg-primary text-white" type="submit">Guardar y Notificar a Planta</button>
      </div>
    </form>
  </main>

  <!-- Script de la pestaña actual -->
  <script type="module" src="js/new_edition_tab.js"></script>
</body>

</html>
