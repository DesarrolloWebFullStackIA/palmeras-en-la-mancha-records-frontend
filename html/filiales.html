<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palmeras en la Mancha — Gestión de Filiales</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Header Componente Global -->
  <header-component></header-component>

  <main class="flex-1">

    <!-- Barra de Control Superior -->
    <section class="bg-white border-b border-slate-200 px-6 py-5">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-600">store</span>
            Red de Filiales Regionales
          </h1>
          <p class="text-xs text-slate-500 mt-0.5">
            Castilla-La Mancha Regional Hub — Distribución física de vinilos y puntos de venta
          </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
          <div class="relative flex-1 sm:w-80">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
            <input id="branchSearchInput" type="text" placeholder="Buscar filial o ciudad..."
              class="w-full h-10 bg-slate-50 border border-slate-200 pl-10 pr-4 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>

          <button type="button" onclick="openNewBranchModal()"
            class="h-10 px-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1.5 shadow-sm transition">
            <span class="material-symbols-outlined text-base">add</span>
            Nueva Filial
          </button>
        </div>
      </div>
    </section>

    <!-- Listado de Filiales en Grid -->
    <section class="px-6 py-8">
      <div class="max-w-7xl mx-auto">
        <div id="branchesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="col-span-full py-16 text-center text-slate-500">
            <span class="material-symbols-outlined text-4xl animate-spin text-blue-600">progress_activity</span>
            <p class="mt-2 text-sm font-medium">Cargando filiales activas...</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal para Crear Nueva Filial -->
  <div id="branchModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <span class="material-symbols-outlined text-blue-600 text-lg">add_business</span>
          Añadir Nueva Filial
        </h3>
        <button type="button" onclick="closeNewBranchModal()" class="text-slate-400 hover:text-slate-600">
          <span class="material-symbols-outlined text-xl">close</span>
        </button>
      </div>

      <form id="branchForm" onsubmit="handleCreateBranch(event)" class="mt-4 space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nombre de la Sucursal <span class="text-red-500">*</span></label>
          <input type="text" id="branchName" required placeholder="Ej: Filial Talavera de la Reina"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Dirección <span class="text-red-500">*</span></label>
          <input type="text" id="branchAddress" required placeholder="Ej: Calle San Francisco 14, Talavera"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Teléfono de Contacto <span class="text-red-500">*</span></label>
          <input type="text" id="branchPhone" required placeholder="Ej: +34 925 800 100"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeNewBranchModal()" class="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-lg transition">
            Cancelar
          </button>
          <button type="submit" id="btnSubmitBranch" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition">
            Guardar Filial
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer Componente Global -->
  <footer-component></footer-component>

  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>

  <script>
    let allBranches = [];

    async function loadBranches() {
      const grid = document.getElementById('branchesGrid');
      grid.innerHTML = `
        <div class="col-span-full py-16 text-center text-slate-500">
          <span class="material-symbols-outlined text-4xl animate-spin text-blue-600">progress_activity</span>
          <p class="mt-2 text-sm font-medium">Cargando filiales...</p>
        </div>
      `;

      allBranches = await api.getBranches(true);
      renderBranches(allBranches);
    }

    function renderBranches(branches) {
      const grid = document.getElementById('branchesGrid');
      if (!branches || branches.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 bg-white border border-dashed border-slate-300 rounded-2xl p-8">
            <span class="material-symbols-outlined text-5xl text-slate-300">store_mall_directory</span>
            <h3 class="text-base font-bold text-slate-700 mt-2">No se encontraron filiales</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Comienza registrando la primera sucursal regional.</p>
            <button type="button" onclick="openNewBranchModal()"
              class="mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-lg hover:bg-blue-700 transition inline-flex items-center gap-1.5 shadow-sm">
              <span class="material-symbols-outlined text-base">add</span> Añadir Filial
            </button>
          </div>
        `;
        return;
      }

      grid.innerHTML = branches.map(branch => {
        const albumCount = branch.albums ? branch.albums.length : 0;
        return `
          <article class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 border border-blue-100">
                  <span class="material-symbols-outlined text-xl">location_city</span>
                </div>
                <span class="text-[10px] font-mono font-semibold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                  FIL-${branch.id}
                </span>
              </div>

              <h2 class="text-base font-bold text-slate-900 mt-3 truncate" title="${branch.name}">
                ${branch.name}
              </h2>

              <div class="mt-3 space-y-2 text-xs text-slate-600">
                <div class="flex items-start gap-2">
                  <span class="material-symbols-outlined text-[16px] text-slate-400 shrink-0 mt-0.5">place</span>
                  <span class="leading-relaxed text-slate-700">${branch.address || 'Sin dirección registrada'}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-[16px] text-slate-400 shrink-0">phone</span>
                  <span class="font-mono text-slate-700">${branch.phone || 'N/A'}</span>
                </div>
              </div>
            </div>

            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5 text-emerald-600 font-semibold bg-emerald-50 px-2.5 py-1 rounded-full text-[11px] border border-emerald-100">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span>Activa / En Línea</span>
              </div>

              <button type="button" onclick="handleDeleteBranch(${branch.id}, '${branch.name.replace(/'/g, "\\'")}')"
                class="text-slate-400 hover:text-red-600 p-1 rounded transition" title="Eliminar filial">
                <span class="material-symbols-outlined text-lg">delete</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Buscador en tiempo real
    document.getElementById('branchSearchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allBranches.filter(b => 
        b.name.toLowerCase().includes(q) || (b.address && b.address.toLowerCase().includes(q))
      );
      renderBranches(filtered);
    });

    // Gestión del Modal
    function openNewBranchModal() {
      document.getElementById('branchForm').reset();
      document.getElementById('branchModal').classList.remove('hidden');
    }

    function closeNewBranchModal() {
      document.getElementById('branchModal').classList.add('hidden');
    }

    async function handleCreateBranch(e) {
      e.preventDefault();
      const name = document.getElementById('branchName').value.trim();
      const address = document.getElementById('branchAddress').value.trim();
      const phone = document.getElementById('branchPhone').value.trim();

      const btn = document.getElementById('btnSubmitBranch');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const res = await api.createBranch({ name, address, phone });
      btn.disabled = false;
      btn.textContent = 'Guardar Filial';

      if (res) {
        closeNewBranchModal();
        await loadBranches();
      }
    }

    async function handleDeleteBranch(id, name) {
      if (!confirm(`¿Estás seguro de que deseas eliminar la filial "${name}"?`)) return;
      const ok = await api.deleteBranch(id);
      if (ok) {
        await loadBranches();
      } else {
        alert('No se pudo eliminar la filial.');
      }
    }

    document.addEventListener('DOMContentLoaded', loadBranches);
  </script>
</body>

</html>
