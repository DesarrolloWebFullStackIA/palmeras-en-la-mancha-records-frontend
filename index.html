<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Palmeras en la Mancha — Vinyl Records & Archive Console</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Header Componente Global -->
  <header-component></header-component>

  <main class="flex-1">

    <!-- Barra de Búsqueda y Creación -->
    <section class="bg-white border-b border-slate-200 px-6 py-5">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-600">library_music</span>
            Catálogo Oficial de Álbumes
          </h1>
          <p class="text-xs text-slate-500 mt-0.5">
            Archivo fonográfico de vinilos con sincronización en tiempo real a Cloudinary CDN
          </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
          <div class="relative flex-1 sm:w-80">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">
              search
            </span>
            <input id="catalogSearchInput" type="text" placeholder="Buscar por título, artista o sello..."
              class="w-full h-10 bg-slate-50 border border-slate-200 pl-10 pr-4 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>

          <button type="button" onclick="goToCreatePage()"
            class="h-10 px-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1.5 shadow-sm transition">
            <span class="material-symbols-outlined text-base">add</span>
            Nuevo Álbum
          </button>
        </div>
      </div>
    </section>

    <!-- Grid de Álbumes Dinámicos -->
    <section class="px-6 py-8">
      <div class="max-w-7xl mx-auto">
        <div id="albumsCatalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- Las tarjetas de los álbumes se cargan dinámicamente desde la API -->
        </div>
      </div>
    </section>

  </main>

  <!-- Footer Componente Global -->
  <footer-component></footer-component>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/script.js"></script>

</body>

</html>
