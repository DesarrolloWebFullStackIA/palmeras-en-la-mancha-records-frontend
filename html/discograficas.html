<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palmeras en la Mancha — Discográficas & Productoras</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Header Componente Global -->
  <header-component></header-component>

  <main class="flex-1">

    <!-- Barra de Control Superior -->
    <section class="bg-white border-b border-slate-200 px-6 py-5">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-600">album</span>
            Discográficas, Sellos & Productoras
          </h1>
          <p class="text-xs text-slate-500 mt-0.5">
            Directorio oficial de sellos discográficos bajo convenio de distribución física de vinilo
          </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
          <div class="relative flex-1 sm:w-80">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
            <input id="labelSearchInput" type="text" placeholder="Buscar sello o país..."
              class="w-full h-10 bg-slate-50 border border-slate-200 pl-10 pr-4 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>

          <button type="button" onclick="openNewLabelModal()"
            class="h-10 px-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1.5 shadow-sm transition">
            <span class="material-symbols-outlined text-base">add</span>
            Añadir Discográfica
          </button>
        </div>
      </div>
    </section>

    <!-- Grid de Discográficas -->
    <section class="px-6 py-8">
      <div class="max-w-7xl mx-auto">
        <div id="labelsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="col-span-full py-16 text-center text-slate-500">
            <span class="material-symbols-outlined text-4xl animate-spin text-blue-600">progress_activity</span>
            <p class="mt-2 text-sm font-medium">Cargando discográficas adscritas...</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal para Añadir Discográfica -->
  <div id="labelModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <span class="material-symbols-outlined text-blue-600 text-lg">domain_add</span>
          Nueva Discográfica / Sello
        </h3>
        <button type="button" onclick="closeNewLabelModal()" class="text-slate-400 hover:text-slate-600">
          <span class="material-symbols-outlined text-xl">close</span>
        </button>
      </div>

      <form id="labelForm" onsubmit="handleCreateLabel(event)" class="mt-4 space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nombre del Sello <span class="text-red-500">*</span></label>
          <input type="text" id="labelName" required placeholder="Ej: Discos La Mancha"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">País de Origen <span class="text-red-500">*</span></label>
          <input type="text" id="labelCountry" required placeholder="Ej: Spain, United States, UK"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Sitio Web Oficial</label>
          <input type="url" id="labelWebsite" placeholder="https://ejemplo.com"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeNewLabelModal()" class="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-lg transition">
            Cancelar
          </button>
          <button type="submit" id="btnSubmitLabel" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition">
            Guardar Sello
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer Componente Global -->
  <footer-component></footer-component>

  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>

  <script>
    let allLabels = [];

    async function loadLabels() {
      const grid = document.getElementById('labelsGrid');
      grid.innerHTML = `
        <div class="col-span-full py-16 text-center text-slate-500">
          <span class="material-symbols-outlined text-4xl animate-spin text-blue-600">progress_activity</span>
          <p class="mt-2 text-sm font-medium">Cargando discográficas...</p>
        </div>
      `;

      allLabels = await api.getRecordLabels();
      renderLabels(allLabels);
    }

    function renderLabels(labels) {
      const grid = document.getElementById('labelsGrid');
      if (!labels || labels.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 bg-white border border-dashed border-slate-300 rounded-2xl p-8">
            <span class="material-symbols-outlined text-5xl text-slate-300">library_music</span>
            <h3 class="text-base font-bold text-slate-700 mt-2">No hay discográficas registradas</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Añade los sellos y productoras con convenio de distribución.</p>
            <button type="button" onclick="openNewLabelModal()"
              class="mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-lg hover:bg-blue-700 transition inline-flex items-center gap-1.5 shadow-sm">
              <span class="material-symbols-outlined text-base">add</span> Añadir Discográfica
            </button>
          </div>
        `;
        return;
      }

      grid.innerHTML = labels.map(label => {
        const websiteLink = label.website
          ? `<a href="${label.website.startsWith('http') ? label.website : 'https://' + label.website}" target="_blank" rel="noopener noreferrer" 
                class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 hover:underline">
               <span>${label.website.replace(/^https?:\/\//, '')}</span>
               <span class="material-symbols-outlined text-[14px]">open_in_new</span>
             </a>`
          : '<span class="text-slate-400">Sin web oficial</span>';

        return `
          <article class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center shrink-0 border border-purple-100">
                  <span class="material-symbols-outlined text-xl">album</span>
                </div>
                <span class="text-[10px] font-mono font-semibold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                  REC-${label.id}
                </span>
              </div>

              <h2 class="text-base font-bold text-slate-900 mt-3 truncate" title="${label.name}">
                ${label.name}
              </h2>

              <div class="mt-3 space-y-2 text-xs text-slate-600">
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-[16px] text-slate-400 shrink-0">public</span>
                  <span class="font-medium text-slate-700">${label.country}</span>
                </div>
                <div class="flex items-center gap-2 truncate">
                  <span class="material-symbols-outlined text-[16px] text-slate-400 shrink-0">language</span>
                  <span class="truncate">${websiteLink}</span>
                </div>
              </div>
            </div>

            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
              <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
                Sello Asociado
              </span>

              <button type="button" onclick="handleDeleteLabel(${label.id}, '${label.name.replace(/'/g, "\\'")}')"
                class="text-slate-400 hover:text-red-600 p-1 rounded transition" title="Eliminar discográfica">
                <span class="material-symbols-outlined text-lg">delete</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Buscador en tiempo real
    document.getElementById('labelSearchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allLabels.filter(l => 
        l.name.toLowerCase().includes(q) || (l.country && l.country.toLowerCase().includes(q))
      );
      renderLabels(filtered);
    });

    // Gestión del Modal
    function openNewLabelModal() {
      document.getElementById('labelForm').reset();
      document.getElementById('labelModal').classList.remove('hidden');
    }

    function closeNewLabelModal() {
      document.getElementById('labelModal').classList.add('hidden');
    }

    async function handleCreateLabel(e) {
      e.preventDefault();
      const name = document.getElementById('labelName').value.trim();
      const country = document.getElementById('labelCountry').value.trim();
      const website = document.getElementById('labelWebsite').value.trim() || null;

      const btn = document.getElementById('btnSubmitLabel');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const res = await api.createRecordLabel({ name, country, website });
      btn.disabled = false;
      btn.textContent = 'Guardar Sello';

      if (res) {
        closeNewLabelModal();
        await loadLabels();
      }
    }

    async function handleDeleteLabel(id, name) {
      if (!confirm(`¿Estás seguro de que deseas eliminar la discográfica "${name}"?`)) return;
      const ok = await api.deleteRecordLabel(id);
      if (ok) {
        await loadLabels();
      } else {
        alert('No se pudo eliminar la discográfica.');
      }
    }

    document.addEventListener('DOMContentLoaded', loadLabels);
  </script>
</body>

</html>
